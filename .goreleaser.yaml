version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: mkcr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

brews:
  - name: mkcr
    repository:
      owner: eimarfandino
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/eimarfandino/snow-cr-cli"
    description: "Create and list ServiceNow Standard Change requests without touching the UI"
    license: "MIT"
    install: |
      bin.install "mkcr"
    test: |
      system "#{bin}/mkcr", "--help"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
